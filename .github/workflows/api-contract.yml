name: API Contract

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Check 1: Detect breaking API changes.
  breaking-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect breaking API changes
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: "origin/${{ github.base_ref }}:backend/openapi.json"
          revision: "HEAD:backend/openapi.json"
          fail-on: WARN
          review: false

  # Check 2: Ensure the frontend still compiles.
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client from current contract
        working-directory: frontend
        run: npm run generate:api

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

  # Check 3: Ensure generated files are committed and up to date.
  generated-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Check for uncommitted generated changes
        run: |
          git diff --exit-code -- frontend/src/api/generated/
          test -z "$(git ls-files --others --exclude-standard -- frontend/src/api/generated/)"
